<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Spark • Offset Morph Viewer</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
    #gui-container {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="gui-container"></div>
  <div id="instructions">
    <h1>Offset Morph Viewer</h1>
    <p>1. Edit anchor and delta paths in the panel</p>
    <p>2. Click Load Morph Pair</p>
    <p>3. Use the morph sliders</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "/examples/js/vendor/three/build/three.module.js",
        "three/addons/": "/examples/js/vendor/three/examples/jsm/",
        "@sparkjsdev/spark": "/dist/spark.module.js",
        "lil-gui": "/examples/js/vendor/lil-gui/dist/lil-gui.esm.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "lil-gui";
    import { SparkRenderer, SplatMesh, dyno } from "@sparkjsdev/spark";

    const DEFAULT_ANCHOR_URL = "/local/expr/UV-CC-HR-RoPE/viz/PT_10524_canonical_rotation.ply";
    const DEFAULT_DELTA_URL = "/local/expr/UV-CC-HR-RoPE/viz/PT_10524_offset_delta.ply";
    const urlParams = new URLSearchParams(window.location.search);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#000000");
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 2);

    const canvas = document.getElementById("canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    function handleResize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    handleResize();
    window.addEventListener("resize", handleResize);

    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;

    const gui = new GUI({ container: document.getElementById("gui-container") });
    const settings = {
      anchorPath: urlParams.get("anchor") || DEFAULT_ANCHOR_URL,
      deltaPath: urlParams.get("delta") || DEFAULT_DELTA_URL,
      alpha: 0,
      scaleAlpha: 1,
      opacityAlpha: 1,
      autoRotate: false,
      backgroundColor: "#000000",
      loadMorphPair: async () => {
        await loadMorphPair(settings.anchorPath, settings.deltaPath);
      },
      resetCamera: () => {
        camera.position.set(0, 0, 2);
        orbitControls.target.set(0, 0, 0);
        orbitControls.update();
      }
    };

    gui.add(settings, "anchorPath").name("Anchor Path");
    gui.add(settings, "deltaPath").name("Delta Path");
    gui.add(settings, "loadMorphPair").name("Load Morph Pair");
    const alphaController = gui.add(settings, "alpha", 0, 1, 0.01).name("Position Morph").disable();
    const scaleController = gui
      .add(settings, "scaleAlpha", 0, 1, 0.01)
      .name("Scale Morph")
      .disable();
    const opacityController = gui
      .add(settings, "opacityAlpha", 0, 1, 0.01)
      .name("Opacity Morph")
      .disable();
    gui.add(settings, "autoRotate").name("Auto Rotate");
    gui.addColor(settings, "backgroundColor").name("Background").onChange(v => scene.background.set(v));
    gui.add(settings, "resetCamera").name("Reset Camera");

    let anchorMesh = null;
    let deltaMesh = null;
    const positionAlphaDyno = dyno.dynoFloat(settings.alpha);
    const scaleAlphaDyno = dyno.dynoFloat(settings.scaleAlpha);
    const opacityAlphaDyno = dyno.dynoFloat(settings.opacityAlpha);

    alphaController.onChange(v => {
      positionAlphaDyno.value = v;
      if (anchorMesh && deltaMesh) anchorMesh.updateVersion();
    });

    scaleController.onChange(v => {
      scaleAlphaDyno.value = v;
      if (anchorMesh && deltaMesh) anchorMesh.updateVersion();
    });

    opacityController.onChange(v => {
      opacityAlphaDyno.value = v;
      if (anchorMesh && deltaMesh) anchorMesh.updateVersion();
    });

    function resetMorphControls() {
      settings.alpha = 0;
      settings.scaleAlpha = 1;
      settings.opacityAlpha = 1;
      positionAlphaDyno.value = settings.alpha;
      scaleAlphaDyno.value = settings.scaleAlpha;
      opacityAlphaDyno.value = settings.opacityAlpha;
      alphaController.updateDisplay();
      scaleController.updateDisplay();
      opacityController.updateDisplay();
      alphaController.disable();
      scaleController.disable();
      opacityController.disable();
    }

    function clearAnchorMesh() {
      if (anchorMesh) {
        scene.remove(anchorMesh);
        anchorMesh = null;
      }
      deltaMesh = null;
      resetMorphControls();
    }

    function hideInstructions() {
      document.getElementById("instructions").style.display = "none";
    }

    async function setAnchorMesh(init) {
      clearAnchorMesh();
      anchorMesh = new SplatMesh(init);
      await anchorMesh.initialized;
      scene.add(anchorMesh);
      hideInstructions();
    }

    function applyMorphModifier() {
      if (!anchorMesh || !deltaMesh) return;

      anchorMesh.worldModifier = dyno.dynoBlock(
        { gsplat: dyno.Gsplat },
        { gsplat: dyno.Gsplat },
        ({ gsplat }) => {
          const { index, center } = dyno.splitGsplat(gsplat).outputs;
          const deltaGsplat = dyno.readPackedSplat(deltaMesh.packedSplats.dyno, index);
          const { center: deltaCenter, scales: deltaScales, opacity: deltaOpacity } =
            dyno.splitGsplat(deltaGsplat).outputs;
          const newCenter = dyno.add(center, dyno.mul(positionAlphaDyno, deltaCenter));
          const newScales = dyno.mul(scaleAlphaDyno, deltaScales);
          const newOpacity = dyno.mul(opacityAlphaDyno, deltaOpacity);
          return {
            gsplat: dyno.combineGsplat({
              gsplat,
              center: newCenter,
              scales: newScales,
              opacity: newOpacity,
            })
          };
        }
      );

      anchorMesh.updateGenerator();
      anchorMesh.updateVersion();
      alphaController.enable();
      scaleController.enable();
      opacityController.enable();
      hideInstructions();
    }

    async function setDeltaMesh(init) {
      if (!anchorMesh) return;

      deltaMesh = new SplatMesh(init);
      await deltaMesh.initialized;

      if (anchorMesh.numSplats !== deltaMesh.numSplats) {
        alert(`Splat count mismatch! Anchor: ${anchorMesh.numSplats}, Delta: ${deltaMesh.numSplats}`);
        deltaMesh = null;
        return;
      }

      applyMorphModifier();
    }

    async function loadAnchorFromUrl(url) {
      await setAnchorMesh({ url });
    }

    async function loadDeltaFromUrl(url) {
      await setDeltaMesh({ url });
    }

    async function loadMorphPair(anchorUrl, deltaUrl) {
      if (!anchorUrl || !deltaUrl) {
        alert("Both anchor and delta paths are required.");
        return;
      }

      try {
        await loadAnchorFromUrl(anchorUrl);
        await loadDeltaFromUrl(deltaUrl);
        const url = new URL(window.location);
        url.searchParams.set("anchor", anchorUrl);
        url.searchParams.set("delta", deltaUrl);
        history.replaceState(null, "", url);
      } catch (err) {
        console.error("Failed to load morph pair:", err);
        alert("Failed to load the anchor/delta pair. Check the paths and console output.");
      }
    }

    renderer.setAnimationLoop((time) => {
      orbitControls.update();
      if (settings.autoRotate && anchorMesh) {
        anchorMesh.rotation.y += 0.01;
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
