<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Spark • Offset Morph Viewer</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
    #gui-container {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
    }
    #candidate-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
    }
    #candidate-select,
    #candidate-refresh,
    #candidate-load {
      background: #161616;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    #candidate-select {
      min-width: 320px;
    }
    #candidate-status {
      color: #bbb;
      font-size: 12px;
      min-width: 120px;
    }
  </style>
</head>

<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="candidate-bar">
    <select id="candidate-select">
      <option value="">Select expr candidate</option>
    </select>
    <button id="candidate-refresh" type="button">Refresh Candidates</button>
    <button id="candidate-load" type="button">Load Selected</button>
    <span id="candidate-status"></span>
  </div>
  <div id="gui-container"></div>
  <div id="instructions">
    <h1>Offset Morph Viewer</h1>
    <p>1. Refresh and pick a candidate, or edit paths manually</p>
    <p>2. Click Load Selected or Load Morph Pair</p>
    <p>3. Use the morph sliders</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "/examples/js/vendor/three/build/three.module.js",
        "three/addons/": "/examples/js/vendor/three/examples/jsm/",
        "@sparkjsdev/spark": "/dist/spark.module.js",
        "lil-gui": "/examples/js/vendor/lil-gui/dist/lil-gui.esm.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "lil-gui";
    import {
      SparkRenderer,
      SplatMesh,
      setPackedSplatCenter,
      setPackedSplatOpacity,
      setPackedSplatScales,
      unpackSplat,
    } from "@sparkjsdev/spark";

    const MORPH_CANDIDATES_URL = "/sam3dgs/morph-candidates";
    const DEFAULT_ANCHOR_URL = "";
    const DEFAULT_DELTA_URL = "";
    const urlParams = new URLSearchParams(window.location.search);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#000000");
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 2);

    const canvas = document.getElementById("canvas");
    const candidateSelect = document.getElementById("candidate-select");
    const candidateRefreshButton = document.getElementById("candidate-refresh");
    const candidateLoadButton = document.getElementById("candidate-load");
    const candidateStatus = document.getElementById("candidate-status");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    function handleResize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    handleResize();
    window.addEventListener("resize", handleResize);

    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.target.set(0, 0, 0);
    orbitControls.update();

    const pressedKeys = new Set();
    const panRight = new THREE.Vector3();
    const panUp = new THREE.Vector3();
    const panDelta = new THREE.Vector3();
    const cameraDirection = new THREE.Vector3();
    let lastFrameTime = performance.now();

    document.addEventListener("keydown", (event) => {
      pressedKeys.add(event.code);
    });
    document.addEventListener("keyup", (event) => {
      pressedKeys.delete(event.code);
    });
    window.addEventListener("blur", () => {
      pressedKeys.clear();
    });

    function updateKeyboardPan(deltaTime) {
      let x = 0;
      let y = 0;
      if (pressedKeys.has("KeyA")) x -= 1;
      if (pressedKeys.has("KeyD")) x += 1;
      if (pressedKeys.has("KeyW")) y += 1;
      if (pressedKeys.has("KeyS")) y -= 1;
      if (x === 0 && y === 0) {
        return;
      }

      camera.getWorldDirection(cameraDirection);
      panRight.crossVectors(cameraDirection, camera.up).normalize();
      panUp.copy(camera.up).normalize();

      const distance = camera.position.distanceTo(orbitControls.target);
      const panSpeed = Math.max(distance, 0.25) * 1.5 * deltaTime;
      panDelta.set(0, 0, 0);
      panDelta.addScaledVector(panRight, x * panSpeed);
      panDelta.addScaledVector(panUp, y * panSpeed);

      camera.position.add(panDelta);
      orbitControls.target.add(panDelta);
    }

    const gui = new GUI({ container: document.getElementById("gui-container") });
    let morphCandidates = [];
    const settings = {
      anchorPath: urlParams.get("anchor") || DEFAULT_ANCHOR_URL,
      deltaPath: urlParams.get("delta") || DEFAULT_DELTA_URL,
      alpha: 0,
      scaleMultiplier: 1,
      opacityMultiplier: 1,
      autoRotate: false,
      backgroundColor: "#000000",
      loadMorphPair: async () => {
        await loadMorphPair(settings.anchorPath, settings.deltaPath);
      },
      resetCamera: () => {
        camera.position.set(0, 0, 2);
        orbitControls.target.set(0, 0, 0);
        orbitControls.update();
      }
    };

    gui.add(settings, "anchorPath").name("Anchor Path");
    gui.add(settings, "deltaPath").name("Delta Path");
    gui.add(settings, "loadMorphPair").name("Load Morph Pair");
    const alphaController = gui.add(settings, "alpha", 0, 1, 0.01).name("Position Morph").disable();
    const scaleController = gui.add(settings, "scaleMultiplier", 0, 1, 0.01).name("Scale").disable();
    const opacityController = gui.add(settings, "opacityMultiplier", 0, 1, 0.01).name("Opacity").disable();
    gui.add(settings, "autoRotate").name("Auto Rotate");
    gui.addColor(settings, "backgroundColor").name("Background").onChange(v => scene.background.set(v));
    gui.add(settings, "resetCamera").name("Reset Camera");

    function setCandidateStatus(message) {
      candidateStatus.textContent = message;
    }

    function resolveLocalPath(pathValue) {
      if (!pathValue) {
        return pathValue;
      }
      if (
        pathValue.startsWith("/local/") ||
        pathValue.startsWith("http://") ||
        pathValue.startsWith("https://") ||
        pathValue.startsWith("/")
      ) {
        return pathValue;
      }
      return `/local/${pathValue.replace(/^\.?\//, "")}`;
    }

    function updateGuiControllers() {
      for (const controller of gui.controllers) {
        controller.updateDisplay();
      }
    }

    function syncCandidateSelection() {
      const matchedCandidate = morphCandidates.find((candidate) => {
        return (
          resolveLocalPath(candidate.anchorPath) === settings.anchorPath &&
          resolveLocalPath(candidate.deltaPath) === settings.deltaPath
        );
      });
      candidateSelect.value = matchedCandidate ? matchedCandidate.anchorPath : "";
    }

    function applyCandidate(candidate) {
      settings.anchorPath = resolveLocalPath(candidate.anchorPath);
      settings.deltaPath = resolveLocalPath(candidate.deltaPath);
      updateGuiControllers();
      syncCandidateSelection();
    }

    function populateCandidateSelect(candidates) {
      morphCandidates = candidates;
      const currentValue = candidateSelect.value;
      candidateSelect.innerHTML = "";

      const placeholderOption = document.createElement("option");
      placeholderOption.value = "";
      placeholderOption.textContent = candidates.length > 0 ? "Select expr candidate" : "No candidates found";
      candidateSelect.appendChild(placeholderOption);

      for (const candidate of candidates) {
        const option = document.createElement("option");
        option.value = candidate.anchorPath;
        option.textContent = candidate.label;
        candidateSelect.appendChild(option);
      }

      if (candidates.some((candidate) => candidate.anchorPath === currentValue)) {
        candidateSelect.value = currentValue;
      } else {
        syncCandidateSelection();
      }
    }

    async function refreshMorphCandidates() {
      setCandidateStatus("Scanning...");
      try {
        const response = await fetch(MORPH_CANDIDATES_URL, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Failed to fetch candidates: ${response.status} ${response.statusText}`);
        }
        const payload = await response.json();
        const candidates = Array.isArray(payload.candidates) ? payload.candidates : [];
        populateCandidateSelect(candidates);
        setCandidateStatus(`${candidates.length} candidate${candidates.length === 1 ? "" : "s"}`);
      } catch (err) {
        console.error("Failed to refresh morph candidates:", err);
        populateCandidateSelect([]);
        setCandidateStatus("Scan failed");
      }
    }

    let anchorMesh = null;
    let deltaOffsets = null;
    let anchorOriginalCenters = null;
    let anchorOriginalScales = null;
    let anchorOriginalOpacities = null;

    alphaController.onChange(() => {
      if (anchorMesh && deltaOffsets && anchorOriginalCenters && anchorOriginalScales && anchorOriginalOpacities) {
        applyVisualizationState();
      }
    });

    scaleController.onChange(() => {
      if (anchorMesh && deltaOffsets && anchorOriginalCenters && anchorOriginalScales && anchorOriginalOpacities) {
        applyVisualizationState();
      }
    });

    opacityController.onChange(() => {
      if (anchorMesh && deltaOffsets && anchorOriginalCenters && anchorOriginalScales && anchorOriginalOpacities) {
        applyVisualizationState();
      }
    });

    function resetMorphControls() {
      settings.alpha = 0;
      settings.scaleMultiplier = 1;
      settings.opacityMultiplier = 1;
      alphaController.updateDisplay();
      scaleController.updateDisplay();
      opacityController.updateDisplay();
      alphaController.disable();
      scaleController.disable();
      opacityController.disable();
    }

    function clearAnchorMesh() {
      if (anchorMesh) {
        scene.remove(anchorMesh);
        anchorMesh = null;
      }
      deltaOffsets = null;
      anchorOriginalCenters = null;
      anchorOriginalScales = null;
      anchorOriginalOpacities = null;
      resetMorphControls();
    }

    function hideInstructions() {
      document.getElementById("instructions").style.display = "none";
    }

    async function setAnchorMesh(init) {
      clearAnchorMesh();
      anchorMesh = new SplatMesh(init);
      await anchorMesh.initialized;
      scene.add(anchorMesh);
      anchorOriginalCenters = extractCenters(anchorMesh);
      const { scales, opacities } = extractScalesAndOpacities(anchorMesh);
      anchorOriginalScales = scales;
      anchorOriginalOpacities = opacities;
      hideInstructions();
    }

    function extractCenters(splatMesh) {
      const packed = splatMesh.packedSplats.packedArray;
      const numSplats = splatMesh.packedSplats.numSplats;
      const centers = new Float32Array(numSplats * 3);
      for (let i = 0; i < numSplats; i++) {
        const unpacked = unpackSplat(packed, i, splatMesh.packedSplats.splatEncoding);
        centers[i * 3 + 0] = unpacked.center.x;
        centers[i * 3 + 1] = unpacked.center.y;
        centers[i * 3 + 2] = unpacked.center.z;
      }
      return centers;
    }

    function extractScalesAndOpacities(splatMesh) {
      const packed = splatMesh.packedSplats.packedArray;
      const numSplats = splatMesh.packedSplats.numSplats;
      const scales = new Float32Array(numSplats * 3);
      const opacities = new Float32Array(numSplats);
      for (let i = 0; i < numSplats; i++) {
        const unpacked = unpackSplat(packed, i, splatMesh.packedSplats.splatEncoding);
        scales[i * 3 + 0] = unpacked.scales.x;
        scales[i * 3 + 1] = unpacked.scales.y;
        scales[i * 3 + 2] = unpacked.scales.z;
        opacities[i] = unpacked.opacity;
      }
      return { scales, opacities };
    }

    function applyVisualizationState() {
      if (!anchorMesh || !deltaOffsets || !anchorOriginalCenters || !anchorOriginalScales || !anchorOriginalOpacities) return;
      const packed = anchorMesh.packedSplats.packedArray;
      const numSplats = anchorMesh.packedSplats.numSplats;
      const alpha = settings.alpha;
      const scaleMultiplier = settings.scaleMultiplier;
      const opacityMultiplier = settings.opacityMultiplier;
      for (let i = 0; i < numSplats; i++) {
        const baseOffset = i * 3;
        setPackedSplatCenter(
          packed,
          i,
          anchorOriginalCenters[baseOffset + 0] + alpha * deltaOffsets[baseOffset + 0],
          anchorOriginalCenters[baseOffset + 1] + alpha * deltaOffsets[baseOffset + 1],
          anchorOriginalCenters[baseOffset + 2] + alpha * deltaOffsets[baseOffset + 2],
        );
        setPackedSplatScales(
          packed,
          i,
          anchorOriginalScales[baseOffset + 0] * scaleMultiplier,
          anchorOriginalScales[baseOffset + 1] * scaleMultiplier,
          anchorOriginalScales[baseOffset + 2] * scaleMultiplier,
          anchorMesh.packedSplats.splatEncoding,
        );
        setPackedSplatOpacity(
          packed,
          i,
          anchorOriginalOpacities[i] * opacityMultiplier,
        );
      }
      anchorMesh.packedSplats.needsUpdate = true;
      anchorMesh.updateVersion();
      alphaController.enable();
      scaleController.enable();
      opacityController.enable();
      hideInstructions();
    }

    function logDeltaStats(url, offsets) {
      if (!offsets || offsets.length === 0) {
        console.log("[morph-offset] Loaded empty delta file:", url);
        return;
      }

      const sampleCount = offsets.length / 3;
      let absMax = 0;
      let magMax = 0;
      let magSum = 0;
      let nonZeroCount = 0;

      for (let i = 0; i < offsets.length; i += 3) {
        const x = offsets[i + 0];
        const y = offsets[i + 1];
        const z = offsets[i + 2];
        absMax = Math.max(absMax, Math.abs(x), Math.abs(y), Math.abs(z));
        const mag = Math.hypot(x, y, z);
        magMax = Math.max(magMax, mag);
        magSum += mag;
        if (mag > 1e-8) {
          nonZeroCount += 1;
        }
      }

      console.log("[morph-offset] Loaded delta file", {
        url,
        sampleCount,
        absMax,
        magMean: magSum / sampleCount,
        magMax,
        nonZeroCount,
        firstOffsets: Array.from(offsets.slice(0, 12)),
      });
    }

    async function setDeltaOffsets(url) {
      if (!anchorMesh) return;
      const resolvedUrl = resolveLocalPath(url);
      const response = await fetch(resolvedUrl, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`Failed to fetch delta offsets: ${response.status} ${response.statusText}`);
      }
      const buffer = await response.arrayBuffer();
      if (buffer.byteLength % (3 * 4) !== 0) {
        throw new Error(`Invalid delta offset buffer size: ${buffer.byteLength}`);
      }
      deltaOffsets = new Float32Array(buffer);
      const expectedCount = anchorMesh.packedSplats.numSplats * 3;
      if (deltaOffsets.length !== expectedCount) {
        throw new Error(`Offset count mismatch! Anchor: ${anchorMesh.packedSplats.numSplats}, Delta entries: ${deltaOffsets.length / 3}`);
      }
      logDeltaStats(resolvedUrl, deltaOffsets);
      applyVisualizationState();
    }

    async function loadAnchorFromUrl(url) {
      await setAnchorMesh({ url: resolveLocalPath(url) });
    }

    async function loadDeltaFromUrl(url) {
      await setDeltaOffsets(url);
    }

    async function loadMorphPair(anchorUrl, deltaUrl) {
      if (!anchorUrl || !deltaUrl) {
        alert("Both anchor and delta paths are required.");
        return;
      }

      try {
        await loadAnchorFromUrl(anchorUrl);
        await loadDeltaFromUrl(deltaUrl);
        const url = new URL(window.location);
        url.searchParams.set("anchor", anchorUrl);
        url.searchParams.set("delta", deltaUrl);
        history.replaceState(null, "", url);
      } catch (err) {
        console.error("Failed to load morph pair:", err);
        alert("Failed to load the anchor/delta pair. Check the paths and console output.");
      }
    }

    candidateRefreshButton.addEventListener("click", async () => {
      await refreshMorphCandidates();
    });

    candidateSelect.addEventListener("change", () => {
      const candidate = morphCandidates.find((item) => item.anchorPath === candidateSelect.value);
      if (!candidate) {
        return;
      }
      applyCandidate(candidate);
    });

    candidateLoadButton.addEventListener("click", async () => {
      const candidate = morphCandidates.find((item) => item.anchorPath === candidateSelect.value);
      if (candidate) {
        applyCandidate(candidate);
      }
      await loadMorphPair(settings.anchorPath, settings.deltaPath);
    });

    await refreshMorphCandidates();
    syncCandidateSelection();

    renderer.setAnimationLoop((time) => {
      const deltaTime = (time - lastFrameTime) / 1000;
      lastFrameTime = time;
      updateKeyboardPan(deltaTime);
      orbitControls.update();
      if (settings.autoRotate && anchorMesh) {
        anchorMesh.rotation.y += 0.01;
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
