<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Spark • Offset Morph Viewer</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
    #gui-container {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
    }
  </style>
</head>

<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="gui-container"></div>
  <div id="instructions">
    <h1>Offset Morph Viewer</h1>
    <p>1. Load Anchor PLY (canonical_rotation.ply)</p>
    <p>2. Load Delta PLY (offset_delta.ply)</p>
    <p>3. Use Alpha slider to morph</p>
  </div>

  <input id="anchor-input" type="file" accept=".ply" style="display: none;" />
  <input id="delta-input" type="file" accept=".ply" style="display: none;" />

  <script type="importmap">
    {
      "imports": {
        "three": "/examples/js/vendor/three/build/three.module.js",
        "three/addons/": "/examples/js/vendor/three/examples/jsm/",
        "@sparkjsdev/spark": "/dist/spark.module.js",
        "lil-gui": "/examples/js/vendor/lil-gui/dist/lil-gui.esm.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { GUI } from "lil-gui";
    import { SparkRenderer, SplatMesh, dyno, isMobile } from "@sparkjsdev/spark";

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 2);

    const canvas = document.getElementById("canvas");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    function handleResize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    handleResize();
    window.addEventListener("resize", handleResize);

    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;

    const gui = new GUI({ container: document.getElementById("gui-container") });
    const settings = {
      alpha: 0,
      autoRotate: false,
      backgroundColor: "#000000",
      loadAnchor: () => document.getElementById("anchor-input").click(),
      loadDelta: () => document.getElementById("delta-input").click(),
      resetCamera: () => {
        camera.position.set(0, 0, 2);
        orbitControls.target.set(0, 0, 0);
        orbitControls.update();
      }
    };

    gui.add(settings, "loadAnchor").name("1. Load Anchor PLY");
    gui.add(settings, "loadDelta").name("2. Load Delta PLY").disable();
    const alphaController = gui.add(settings, "alpha", 0, 1, 0.01).name("Alpha Morph").disable();
    gui.add(settings, "autoRotate").name("Auto Rotate");
    gui.addColor(settings, "backgroundColor").name("Background").onChange(v => scene.background.set(v));
    gui.add(settings, "resetCamera").name("Reset Camera");

    let anchorMesh = null;
    let deltaMesh = null;
    const alphaDyno = dyno.dynoFloat(0);

    alphaController.onChange(v => {
      alphaDyno.value = v;
      if (anchorMesh) anchorMesh.updateVersion();
    });

    document.getElementById("anchor-input").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      if (anchorMesh) {
        scene.remove(anchorMesh);
        anchorMesh = null;
      }
      
      const fileBytes = new Uint8Array(await file.arrayBuffer());
      anchorMesh = new SplatMesh({ fileBytes, fileName: file.name });
      await anchorMesh.initialized;
      scene.add(anchorMesh);
      
      gui.controllers.find(c => c._name === "2. Load Delta PLY").enable();
      document.getElementById("instructions").style.display = "none";
    };

    document.getElementById("delta-input").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (!anchorMesh) return;

      const fileBytes = new Uint8Array(await file.arrayBuffer());
      deltaMesh = new SplatMesh({ fileBytes, fileName: file.name });
      await deltaMesh.initialized;

      // Ensure splat counts match
      if (anchorMesh.numSplats !== deltaMesh.numSplats) {
        alert(`Splat count mismatch! Anchor: ${anchorMesh.numSplats}, Delta: ${deltaMesh.numSplats}`);
        return;
      }

      const deltaPSDyno = new dyno.DynoUniform({
        key: "deltaPS",
        type: dyno.TPackedSplats,
        value: deltaMesh.packedSplats,
      });

      anchorMesh.worldModifier = dyno.dynoBlock(
        { gsplat: dyno.Gsplat },
        { gsplat: dyno.Gsplat },
        ({ gsplat }) => {
          const { index, center } = dyno.splitGsplat(gsplat).outputs;
          const deltaGsplat = dyno.readPackedSplat(deltaPSDyno, index);
          const { center: deltaCenter } = dyno.splitGsplat(deltaGsplat).outputs;
          const newCenter = dyno.add(center, dyno.mul(alphaDyno, deltaCenter));
          return { gsplat: dyno.combineGsplat({ gsplat, center: newCenter }) };
        }
      );
      
      anchorMesh.updateGenerator();
      alphaController.enable();
    };

    renderer.setAnimationLoop((time) => {
      orbitControls.update();
      if (settings.autoRotate && anchorMesh) {
        anchorMesh.rotation.y += 0.01;
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
