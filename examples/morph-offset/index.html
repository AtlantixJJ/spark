<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Spark • Offset Morph Viewer</title>
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
    #right-panel {
      position: absolute;
      top: 66px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 0;
      align-items: stretch;
      max-width: 310px;
      min-width: 260px;
    }
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 10px;
    }
    #candidate-bar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(6px);
    }
    #scan-target-select,
    #folder-browse,
    #folder-clear,
    #model-select,
    #candidate-select,
    #candidate-refresh,
    #candidate-load {
      background: #161616;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0 10px;
      height: 36px;
      box-sizing: border-box;
      font: inherit;
    }
    #folder-wrapper {
      position: relative;
    }
    #folder-label {
      color: #bbb;
      font-size: 12px;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #folder-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 100;
      width: 270px;
      max-height: 360px;
      padding: 8px;
      box-sizing: border-box;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #folder-panel.open {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #folder-current {
      color: #bbb;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    #folder-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 220px;
      overflow: auto;
    }
    .folder-entry,
    #folder-up,
    #folder-select {
      background: #161616;
      color: #fff;
      border: 1px solid #333;
      border-radius: 6px;
      padding: 0 8px;
      min-height: 30px;
      box-sizing: border-box;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .folder-entry {
      text-align: left;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .folder-entry:hover,
    #folder-up:hover,
    #folder-select:hover {
      border-color: #555;
    }
    #folder-up:disabled,
    #folder-clear:disabled {
      color: #555;
      cursor: default;
      border-color: #2a2a2a;
    }
    #folder-actions {
      display: flex;
      gap: 6px;
    }
    #folder-actions button {
      flex: 1;
    }
    #model-select {
      min-width: 140px;
      max-width: 220px;
    }
    #candidate-select {
      min-width: 200px;
      max-width: 320px;
    }
    #candidate-status {
      color: #bbb;
      font-size: 12px;
      min-width: 80px;
    }
    #filter-wrapper {
      position: relative;
    }
    #filter-btn {
      background: #161616;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 0 10px;
      height: 36px;
      box-sizing: border-box;
      font: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    #filter-btn:hover {
      border-color: #555;
    }
    #filter-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 8px 10px;
      z-index: 100;
      min-width: 150px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    }
    #filter-panel.open {
      display: block;
    }
    .filter-label {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 2px;
      cursor: pointer;
      font-size: 13px;
      color: #ddd;
      user-select: none;
      white-space: nowrap;
    }
    .filter-label:hover {
      color: #fff;
    }
    .filter-label input[type="checkbox"] {
      accent-color: #888;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }
    .filter-count {
      color: #666;
      font-size: 11px;
      margin-left: auto;
    }

    /* Control tab panel */
    #control-tab-panel {
      background: rgba(18, 18, 18, 0.88);
      backdrop-filter: blur(6px);
      border-radius: 10px;
      overflow: hidden;
      font-size: 13px;
      color: #fff;
    }
    .tab-header {
      background: rgba(36, 36, 36, 0.95);
      padding: 7px 12px;
      font-size: 10px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #999;
      border-bottom: 1px solid #2a2a2a;
      user-select: none;
    }
    .tab-body {
      padding: 8px 10px 10px;
    }
    .global-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding-bottom: 8px;
      border-bottom: 1px solid #2a2a2a;
      margin-bottom: 8px;
    }
    .global-controls label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 12px;
      color: #ccc;
      user-select: none;
    }
    .global-controls input[type="checkbox"] {
      accent-color: #888;
      cursor: pointer;
    }
    .global-controls input[type="color"] {
      width: 28px;
      height: 24px;
      border: 1px solid #444;
      border-radius: 4px;
      background: none;
      cursor: pointer;
      padding: 1px;
      vertical-align: middle;
    }
    .small-btn {
      background: #1e1e1e;
      border: 1px solid #444;
      color: #ccc;
      border-radius: 4px;
      padding: 3px 8px;
      cursor: pointer;
      font-size: 11px;
      line-height: 1.5;
    }
    .small-btn:hover { background: #333; }

    /* GS list */
    #gs-empty {
      color: #555;
      font-size: 12px;
      padding: 4px 2px;
      font-style: italic;
    }
    .gs-entry {
      border-bottom: 1px solid #222;
      padding: 6px 0 8px;
    }
    .gs-entry:last-child { border-bottom: none; }
    .gs-title-row {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 5px;
    }
    .gs-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
      color: #e0e0e0;
      font-weight: 500;
    }
    .gs-toggle {
      background: #1e1e1e;
      border: 1px solid #444;
      color: #eee;
      border-radius: 4px;
      padding: 2px 6px;
      cursor: pointer;
      font-size: 11px;
      flex-shrink: 0;
      line-height: 1.4;
    }
    .gs-toggle.hidden-gs { color: #555; border-color: #333; }
    .gs-remove {
      background: #1e1e1e;
      border: 1px solid #444;
      color: #c55;
      border-radius: 4px;
      padding: 2px 5px;
      cursor: pointer;
      font-size: 11px;
      flex-shrink: 0;
      line-height: 1.4;
    }
    .gs-remove:hover { background: #3a1515; }
    .gs-slider-row {
      display: grid;
      grid-template-columns: 58px 1fr 36px;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
    }
    .gs-slider-label {
      font-size: 11px;
      color: #888;
      text-align: right;
      white-space: nowrap;
    }
    .gs-slider {
      width: 100%;
      accent-color: #666;
      cursor: pointer;
    }
    .gs-slider:disabled { opacity: 0.3; cursor: default; }
    .gs-slider-val {
      font-size: 10px;
      color: #777;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

<body>
  <canvas id="canvas" tabindex="0"></canvas>
  <div id="candidate-bar">
    <select id="scan-target-select">
      <option value="expr">expr (excl. visualize)</option>
      <option value="expr-visualize">expr/visualize</option>
    </select>
    <div id="folder-wrapper">
      <button id="folder-browse" type="button">Scope ▾</button>
      <div id="folder-panel">
        <div id="folder-current">expr</div>
        <div id="folder-list"></div>
        <div id="folder-actions">
          <button id="folder-up" type="button">Up</button>
          <button id="folder-select" type="button">Use Folder</button>
        </div>
      </div>
    </div>
    <button id="folder-clear" type="button" title="Clear folder scope">All</button>
    <span id="folder-label">All folders</span>
    <select id="model-select">
      <option value="">All Models</option>
    </select>
    <div id="filter-wrapper">
      <button id="filter-btn" type="button">Filter ▾</button>
      <div id="filter-panel">
        <label class="filter-label"><input type="checkbox" id="filter-fac" checked> FAC GS <span class="filter-count" id="count-fac"></span></label>
        <label class="filter-label"><input type="checkbox" id="filter-image-gs" checked> Image GS <span class="filter-count" id="count-image-gs"></span></label>
        <label class="filter-label"><input type="checkbox" id="filter-token-canonical-gs" checked> Token Canonical GS <span class="filter-count" id="count-token-canonical-gs"></span></label>
        <label class="filter-label"><input type="checkbox" id="filter-canonical" checked> Canonical <span class="filter-count" id="count-canonical"></span></label>
        <label class="filter-label"><input type="checkbox" id="filter-posed" checked> Posed <span class="filter-count" id="count-posed"></span></label>
        <label class="filter-label"><input type="checkbox" id="filter-dbg-step"> Dbg Step <span class="filter-count" id="count-dbg-step"></span></label>
      </div>
    </div>
    <select id="candidate-select">
      <option value="">Select expr candidate</option>
    </select>
    <button id="candidate-refresh" type="button">Refresh</button>
    <button id="candidate-load" type="button">Load Selected</button>
    <span id="candidate-status"></span>
  </div>
  <div id="right-panel">
    <div id="control-tab-panel">
      <div class="tab-header">Controls</div>
      <div class="tab-body">
        <div class="global-controls">
          <label>
            <input type="checkbox" id="auto-rotate-chk">
            Auto Rotate
          </label>
          <label title="Background color">
            Bg
            <input type="color" id="bg-color-input" value="#000000">
          </label>
          <button id="reset-camera-btn" class="small-btn">↺ Reset</button>
          <button id="render-btn" class="small-btn">⬇ Render</button>
        </div>
        <div id="gs-list">
          <div id="gs-empty">No GS loaded</div>
        </div>
      </div>
    </div>
  </div>
  <div id="instructions">
    <h1>Offset Morph Viewer</h1>
    <p>1. Refresh and pick a candidate</p>
    <p>2. Click Load Selected (up to 5 GS)</p>
    <p>3. Use the morph sliders</p>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "/examples/js/vendor/three/build/three.module.js",
        "three/addons/": "/examples/js/vendor/three/examples/jsm/",
        "@sparkjsdev/spark": "/dist/spark.module.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import {
      SparkRenderer,
      SplatMesh,
      setPackedSplatCenter,
      setPackedSplatOpacity,
      setPackedSplatScales,
      unpackSplat,
    } from "@sparkjsdev/spark";

    const MORPH_MODELS_URL = "/sam3dgs/morph-models";
    const MORPH_CANDIDATES_URL = "/sam3dgs/morph-candidates";
    const MORPH_FOLDERS_URL = "/sam3dgs/morph-folders";
    const MAX_GS = 5;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color("#000000");
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 2);

    const canvas = document.getElementById("canvas");
    const scanTargetSelect = document.getElementById("scan-target-select");
    const folderWrapper = document.getElementById("folder-wrapper");
    const folderBrowseButton = document.getElementById("folder-browse");
    const folderPanel = document.getElementById("folder-panel");
    const folderCurrent = document.getElementById("folder-current");
    const folderList = document.getElementById("folder-list");
    const folderUpButton = document.getElementById("folder-up");
    const folderSelectButton = document.getElementById("folder-select");
    const folderClearButton = document.getElementById("folder-clear");
    const folderLabel = document.getElementById("folder-label");
    const modelSelect = document.getElementById("model-select");
    const candidateSelect = document.getElementById("candidate-select");
    const candidateRefreshButton = document.getElementById("candidate-refresh");
    const candidateLoadButton = document.getElementById("candidate-load");
    const candidateStatus = document.getElementById("candidate-status");
    const gsList = document.getElementById("gs-list");

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    const spark = new SparkRenderer({ renderer });
    scene.add(spark);

    function handleResize() {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      renderer.setSize(width, height, false);
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
    }
    handleResize();
    window.addEventListener("resize", handleResize);

    const orbitControls = new OrbitControls(camera, renderer.domElement);
    orbitControls.enableDamping = true;
    orbitControls.target.set(0, 0, 0);
    orbitControls.update();

    const pressedKeys = new Set();
    const panRight = new THREE.Vector3();
    const panUp = new THREE.Vector3();
    const panDelta = new THREE.Vector3();
    const cameraDirection = new THREE.Vector3();
    const rollForward = new THREE.Vector3();
    const rollQuat = new THREE.Quaternion();
    let lastFrameTime = performance.now();

    document.addEventListener("keydown", (event) => { pressedKeys.add(event.code); });
    document.addEventListener("keyup", (event) => { pressedKeys.delete(event.code); });
    window.addEventListener("blur", () => { pressedKeys.clear(); });

    function updateKeyboardPan(deltaTime) {
      let x = 0;
      let y = 0;
      if (pressedKeys.has("KeyA")) x -= 1;
      if (pressedKeys.has("KeyD")) x += 1;
      if (pressedKeys.has("KeyW")) y += 1;
      if (pressedKeys.has("KeyS")) y -= 1;
      if (x === 0 && y === 0) return;

      camera.getWorldDirection(cameraDirection);
      panRight.crossVectors(cameraDirection, camera.up).normalize();
      panUp.copy(camera.up).normalize();

      const distance = camera.position.distanceTo(orbitControls.target);
      const panSpeed = Math.max(distance, 0.25) * 1.5 * deltaTime;
      panDelta.set(0, 0, 0);
      panDelta.addScaledVector(panRight, x * panSpeed);
      panDelta.addScaledVector(panUp, y * panSpeed);

      camera.position.add(panDelta);
      orbitControls.target.add(panDelta);
    }

    function updateKeyboardRoll(deltaTime) {
      const rollDir = pressedKeys.has("KeyR") ? 1 : pressedKeys.has("KeyF") ? -1 : 0;
      if (rollDir === 0) return;

      const rollSpeed = 1.2 * deltaTime;
      camera.getWorldDirection(rollForward);
      rollQuat.setFromAxisAngle(rollForward, rollDir * rollSpeed);
      camera.up.applyQuaternion(rollQuat).normalize();
      orbitControls.update();
    }

    // --- Global controls ---
    const autoRotateChk = document.getElementById("auto-rotate-chk");
    const bgColorInput = document.getElementById("bg-color-input");

    bgColorInput.addEventListener("input", (e) => {
      scene.background.set(e.target.value);
    });

    document.getElementById("reset-camera-btn").addEventListener("click", () => {
      camera.position.set(0, 0, 2);
      camera.up.set(0, 1, 0);
      orbitControls.target.set(0, 0, 0);
      orbitControls.update();
    });

    document.getElementById("render-btn").addEventListener("click", () => {
      const RENDER_SIZE = 1024;

      const savedRendererSize = new THREE.Vector2();
      renderer.getSize(savedRendererSize);
      const savedAspect = camera.aspect;
      const savedBackground = scene.background;
      const savedClearColor = renderer.getClearColor(new THREE.Color());
      const savedClearAlpha = renderer.getClearAlpha();

      // Pause animation loop so nothing overwrites the canvas before blob capture
      renderer.setAnimationLoop(null);

      renderer.setSize(RENDER_SIZE, RENDER_SIZE, false);
      camera.aspect = 1.0;
      camera.updateProjectionMatrix();
      scene.background = null;
      renderer.setClearColor(0x000000, 0);
      renderer.render(scene, camera);

      canvas.toBlob((blob) => {
        renderer.setSize(savedRendererSize.x, savedRendererSize.y, false);
        camera.aspect = savedAspect;
        camera.updateProjectionMatrix();
        scene.background = savedBackground;
        renderer.setClearColor(savedClearColor, savedClearAlpha);
        renderer.setAnimationLoop(animateFrame);

        if (blob) {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "render.png";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }
      }, "image/png");
    });

    // --- Filter dropdown ---
    const filterBtn = document.getElementById("filter-btn");
    const filterPanel = document.getElementById("filter-panel");
    const filterFac = document.getElementById("filter-fac");
    const filterImageGs = document.getElementById("filter-image-gs");
    const filterTokenCanonicalGs = document.getElementById("filter-token-canonical-gs");
    const filterCanonical = document.getElementById("filter-canonical");
    const filterPosed = document.getElementById("filter-posed");
    const filterDbgStep = document.getElementById("filter-dbg-step");

    filterBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      filterPanel.classList.toggle("open");
    });
    document.addEventListener("click", (e) => {
      if (!filterPanel.contains(e.target) && e.target !== filterBtn) {
        filterPanel.classList.remove("open");
      }
    });

    let morphCandidates = [];
    let currentScanTarget = "expr";
    let selectedFolderScope = null;
    let folderBrowserScope = "";

    function hasFolderScope() {
      return selectedFolderScope !== null;
    }

    function formatExprPath(scope) {
      return scope ? `expr/${scope}` : "expr";
    }

    function updateFolderScopeLabel() {
      if (!hasFolderScope()) {
        folderLabel.textContent = "All folders";
        folderLabel.title = "All folders";
        folderClearButton.disabled = true;
        return;
      }
      const label = formatExprPath(selectedFolderScope);
      folderLabel.textContent = label;
      folderLabel.title = label;
      folderClearButton.disabled = false;
    }

    async function fetchJson(url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`${response.status} ${response.statusText}`);
      }
      return response.json();
    }

    function setFolderPanelOpen(open) {
      folderPanel.classList.toggle("open", open);
    }

    function renderFolderListing(listing) {
      folderBrowserScope = listing.currentPath || "";
      folderCurrent.textContent = formatExprPath(folderBrowserScope);
      folderCurrent.title = folderCurrent.textContent;
      folderUpButton.disabled = folderBrowserScope === "";
      folderUpButton.dataset.parentPath = listing.parentPath || "";

      folderList.innerHTML = "";
      if (!Array.isArray(listing.folders) || listing.folders.length === 0) {
        const empty = document.createElement("div");
        empty.className = "folder-entry";
        empty.textContent = "No subfolders";
        empty.style.color = "#777";
        folderList.appendChild(empty);
        return;
      }

      for (const folder of listing.folders) {
        const button = document.createElement("button");
        button.className = "folder-entry";
        button.type = "button";
        button.textContent = folder.name;
        button.title = formatExprPath(folder.path);
        button.addEventListener("click", async () => {
          try {
            await loadFolderListing(folder.path);
          } catch (err) {
            console.error("Failed to browse child folder:", err);
            setCandidateStatus("Browse failed");
          }
        });
        folderList.appendChild(button);
      }
    }

    async function loadFolderListing(scope) {
      folderCurrent.textContent = "Loading...";
      const query = encodeURIComponent(scope || "");
      const listing = await fetchJson(`${MORPH_FOLDERS_URL}?scope=${query}`);
      renderFolderListing(listing);
    }

    async function openFolderBrowser() {
      if (folderPanel.classList.contains("open")) {
        setFolderPanelOpen(false);
        return;
      }
      setFolderPanelOpen(true);
      await loadFolderListing(hasFolderScope() ? selectedFolderScope : folderBrowserScope);
    }

    async function selectBrowsedFolder() {
      selectedFolderScope = folderBrowserScope;
      updateFolderScopeLabel();
      setFolderPanelOpen(false);
      await refreshModels();
    }

    async function clearFolderScope() {
      selectedFolderScope = null;
      folderBrowserScope = "";
      updateFolderScopeLabel();
      setFolderPanelOpen(false);
      await refreshModels();
    }

    function populateModelSelect(models) {
      const prevValue = modelSelect.value;
      modelSelect.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      placeholder.textContent = hasFolderScope()
        ? "All in folder"
        : models.length > 0
          ? "Select a model"
          : "No models found";
      modelSelect.appendChild(placeholder);
      for (const m of models) {
        const opt = document.createElement("option");
        opt.value = m;
        opt.textContent = m;
        modelSelect.appendChild(opt);
      }
      if (models.includes(prevValue)) {
        modelSelect.value = prevValue;
      } else {
        modelSelect.value = "";
      }
    }

    function candidateMatchesFilter(candidate) {
      if (candidate.isDebugStep && !filterDbgStep.checked) return false;
      if (candidate.variant === "fac") return filterFac.checked;
      if (candidate.variant === "image_gs") return filterImageGs.checked;
      if (candidate.variant === "token_canonical_gs") return filterTokenCanonicalGs.checked;
      if (candidate.variant === "canonical") return filterCanonical.checked;
      if (candidate.variant === "posed" || candidate.variant === "posed_gs") return filterPosed.checked;
      return true;
    }

    function updateFilterCounts() {
      const counts = { fac: 0, image_gs: 0, token_canonical_gs: 0, canonical: 0, posed: 0, dbgStep: 0 };
      for (const c of morphCandidates) {
        if (c.isDebugStep) counts.dbgStep++;
        if (c.variant === "fac") counts.fac++;
        else if (c.variant === "image_gs") counts.image_gs++;
        else if (c.variant === "token_canonical_gs") counts.token_canonical_gs++;
        else if (c.variant === "canonical") counts.canonical++;
        else if (c.variant === "posed" || c.variant === "posed_gs") counts.posed++;
      }
      document.getElementById("count-fac").textContent = counts.fac ? `(${counts.fac})` : "";
      document.getElementById("count-image-gs").textContent = counts.image_gs ? `(${counts.image_gs})` : "";
      document.getElementById("count-token-canonical-gs").textContent = counts.token_canonical_gs ? `(${counts.token_canonical_gs})` : "";
      document.getElementById("count-canonical").textContent = counts.canonical ? `(${counts.canonical})` : "";
      document.getElementById("count-posed").textContent = counts.posed ? `(${counts.posed})` : "";
      document.getElementById("count-dbg-step").textContent = counts.dbgStep ? `(${counts.dbgStep})` : "";
    }

    function rebuildCandidateSelect() {
      const filtered = morphCandidates.filter(candidateMatchesFilter);
      candidateSelect.innerHTML = "";
      const placeholder = document.createElement("option");
      placeholder.value = "";
      if (!modelSelect.value && !hasFolderScope()) {
        placeholder.textContent = "Select a model first";
      } else {
        placeholder.textContent = filtered.length > 0 ? "Select candidate" : "No candidates match filter";
      }
      candidateSelect.appendChild(placeholder);
      for (const candidate of filtered) {
        const option = document.createElement("option");
        option.value = candidate.anchorPath;
        let shortLabel;
        if (hasFolderScope()) {
          const scopeRoot = formatExprPath(selectedFolderScope);
          const vizDir = candidate.vizDir || "";
          const relDir = vizDir === scopeRoot
            ? ""
            : vizDir.startsWith(`${scopeRoot}/`)
              ? vizDir.slice(scopeRoot.length + 1)
              : vizDir;
          const filenameStem = candidate.fileName.replace(/\.ply$/i, "");
          shortLabel = relDir ? `${relDir}/${filenameStem}` : filenameStem;
        } else if (currentScanTarget === "expr-visualize") {
          // Show dataset/subject/filename path jointly
          const parts = (candidate.vizDir || "").split("/");
          const subPath = parts.slice(3).join("/"); // DATASET/SUBJECT (model dir is parts[2], already selected)
          const filenameStem = candidate.fileName.replace(/\.ply$/i, "");
          shortLabel = subPath ? `${subPath}/${filenameStem}` : filenameStem;
        } else {
          // Show sub-path within model dir :: step :: variant
          const parts = (candidate.vizDir || "").split("/");
          const subPath = parts.slice(2).join("/");
          const prefix = subPath ? `${subPath} :: ` : "";
          shortLabel = `${prefix}${candidate.step} :: ${candidate.variant}${candidate.deltaPath ? "" : " (no delta)"}`;
        }
        option.textContent = shortLabel;
        candidateSelect.appendChild(option);
      }
    }

    [filterFac, filterImageGs, filterTokenCanonicalGs, filterCanonical, filterPosed, filterDbgStep].forEach(cb => {
      cb.addEventListener("change", rebuildCandidateSelect);
    });

    modelSelect.addEventListener("change", async () => {
      const selectedModel = modelSelect.value;
      if (!selectedModel && !hasFolderScope()) {
        morphCandidates = [];
        updateFilterCounts();
        rebuildCandidateSelect();
        setCandidateStatus("");
        return;
      }
      await refreshCandidatesForModel(selectedModel);
    });

    // --- Loaded GS state ---
    const loadedSplats = [];

    function setCandidateStatus(message) {
      candidateStatus.textContent = message;
    }

    function resolveLocalPath(pathValue) {
      if (!pathValue) return pathValue;
      if (
        pathValue.startsWith("/local/") ||
        pathValue.startsWith("http://") ||
        pathValue.startsWith("https://") ||
        pathValue.startsWith("/")
      ) {
        return pathValue;
      }
      return `/local/${pathValue.replace(/^\.?\//, "")}`;
    }

    async function refreshModels() {
      setCandidateStatus("Loading models...");
      try {
        const scanTarget = scanTargetSelect.value || "expr";
        currentScanTarget = scanTarget;
        const params = new URLSearchParams({ scanTarget });
        if (hasFolderScope()) params.set("scope", selectedFolderScope);
        const payload = await fetchJson(`${MORPH_MODELS_URL}?${params.toString()}`);
        const models = Array.isArray(payload.models) ? payload.models : [];
        populateModelSelect(models);
        // Clear candidates since model selection was reset
        morphCandidates = [];
        updateFilterCounts();
        rebuildCandidateSelect();
        if (hasFolderScope()) {
          await refreshCandidatesForModel(modelSelect.value);
        } else {
          setCandidateStatus(models.length > 0 ? `${models.length} model(s)` : "No models found");
        }
      } catch (err) {
        console.error("Failed to refresh models:", err);
        populateModelSelect([]);
        morphCandidates = [];
        updateFilterCounts();
        rebuildCandidateSelect();
        setCandidateStatus("Scan failed");
      }
    }

    async function refreshCandidatesForModel(modelName) {
      setCandidateStatus("Scanning...");
      try {
        const params = new URLSearchParams({ scanTarget: currentScanTarget });
        if (modelName) params.set("model", modelName);
        if (hasFolderScope()) params.set("scope", selectedFolderScope);
        const payload = await fetchJson(`${MORPH_CANDIDATES_URL}?${params.toString()}`);
        const candidates = Array.isArray(payload.candidates) ? payload.candidates : [];
        morphCandidates = candidates;
        updateFilterCounts();
        rebuildCandidateSelect();
        setCandidateStatus(`${candidates.length} found`);
      } catch (err) {
        console.error("Failed to fetch candidates:", err);
        morphCandidates = [];
        updateFilterCounts();
        rebuildCandidateSelect();
        setCandidateStatus("Scan failed");
      }
    }

    function updateInstructionsVisibility() {
      document.getElementById("instructions").style.display = loadedSplats.length > 0 ? "none" : "";
    }

    function updateEmptyLabel() {
      const empty = document.getElementById("gs-empty");
      if (empty) empty.style.display = loadedSplats.length > 0 ? "none" : "";
    }

    function isPosedAnchorPath(pathValue) {
      return (pathValue || "").split("?")[0].endsWith("_posed.ply");
    }

    function extractCenters(splatMesh) {
      const packed = splatMesh.packedSplats.packedArray;
      const numSplats = splatMesh.packedSplats.numSplats;
      const centers = new Float32Array(numSplats * 3);
      for (let i = 0; i < numSplats; i++) {
        const unpacked = unpackSplat(packed, i, splatMesh.packedSplats.splatEncoding);
        centers[i * 3 + 0] = unpacked.center.x;
        centers[i * 3 + 1] = unpacked.center.y;
        centers[i * 3 + 2] = unpacked.center.z;
      }
      return centers;
    }

    function extractScalesAndOpacities(splatMesh) {
      const packed = splatMesh.packedSplats.packedArray;
      const numSplats = splatMesh.packedSplats.numSplats;
      const scales = new Float32Array(numSplats * 3);
      const opacities = new Float32Array(numSplats);
      for (let i = 0; i < numSplats; i++) {
        const unpacked = unpackSplat(packed, i, splatMesh.packedSplats.splatEncoding);
        scales[i * 3 + 0] = unpacked.scales.x;
        scales[i * 3 + 1] = unpacked.scales.y;
        scales[i * 3 + 2] = unpacked.scales.z;
        opacities[i] = unpacked.opacity;
      }
      return { scales, opacities };
    }

    function applyVisualizationStateToEntry(entry) {
      if (!entry.anchorMesh || !entry.deltaOffsets || !entry.originalCenters) return;
      const packed = entry.anchorMesh.packedSplats.packedArray;
      const numSplats = entry.anchorMesh.packedSplats.numSplats;
      const alpha = entry.alpha;
      const scaleMultiplier = entry.scaleMultiplier;
      const opacityMultiplier = entry.visible ? entry.opacityMultiplier : 0;
      for (let i = 0; i < numSplats; i++) {
        const baseOffset = i * 3;
        setPackedSplatCenter(
          packed, i,
          entry.originalCenters[baseOffset + 0] + alpha * entry.deltaOffsets[baseOffset + 0],
          entry.originalCenters[baseOffset + 1] + alpha * entry.deltaOffsets[baseOffset + 1],
          entry.originalCenters[baseOffset + 2] + alpha * entry.deltaOffsets[baseOffset + 2],
        );
        setPackedSplatScales(
          packed, i,
          entry.originalScales[baseOffset + 0] * scaleMultiplier,
          entry.originalScales[baseOffset + 1] * scaleMultiplier,
          entry.originalScales[baseOffset + 2] * scaleMultiplier,
          entry.anchorMesh.packedSplats.splatEncoding,
        );
        setPackedSplatOpacity(packed, i, entry.originalOpacities[i] * opacityMultiplier);
      }
      entry.anchorMesh.packedSplats.needsUpdate = true;
      entry.anchorMesh.updateVersion();
      entry.anchorMesh.rotation.y = entry.rotationY;
    }

    function logDeltaStats(url, offsets) {
      if (!offsets || offsets.length === 0) {
        console.log("[morph-offset] Loaded empty delta file:", url);
        return;
      }
      const sampleCount = offsets.length / 3;
      let absMax = 0, magMax = 0, magSum = 0, nonZeroCount = 0;
      for (let i = 0; i < offsets.length; i += 3) {
        const x = offsets[i + 0], y = offsets[i + 1], z = offsets[i + 2];
        absMax = Math.max(absMax, Math.abs(x), Math.abs(y), Math.abs(z));
        const mag = Math.hypot(x, y, z);
        magMax = Math.max(magMax, mag);
        magSum += mag;
        if (mag > 1e-8) nonZeroCount += 1;
      }
      console.log("[morph-offset] Loaded delta file", {
        url, sampleCount, absMax,
        magMean: magSum / sampleCount, magMax, nonZeroCount,
        firstOffsets: Array.from(offsets.slice(0, 12)),
      });
    }

    function removeGSEntry(entry) {
      const idx = loadedSplats.indexOf(entry);
      if (idx === -1) return;
      loadedSplats.splice(idx, 1);
      if (entry.anchorMesh) scene.remove(entry.anchorMesh);
      if (entry.domRow) entry.domRow.remove();
      updateEmptyLabel();
      updateInstructionsVisibility();
      setCandidateStatus(`${loadedSplats.length}/${MAX_GS} loaded`);
    }

    function toggleGSVisibility(entry) {
      entry.visible = !entry.visible;
      entry.domToggle.textContent = entry.visible ? "👁" : "👁‍🗨";
      entry.domToggle.classList.toggle("hidden-gs", !entry.visible);
      applyVisualizationStateToEntry(entry);
    }

    function makeSliderRow(labelText, min, max, step, initialValue, disabled, onChange) {
      const row = document.createElement("div");
      row.className = "gs-slider-row";

      const label = document.createElement("span");
      label.className = "gs-slider-label";
      label.textContent = labelText;

      const slider = document.createElement("input");
      slider.type = "range";
      slider.className = "gs-slider";
      slider.min = min;
      slider.max = max;
      slider.step = step;
      slider.value = initialValue;
      if (disabled) slider.disabled = true;

      const valDisplay = document.createElement("span");
      valDisplay.className = "gs-slider-val";
      valDisplay.textContent = Number(initialValue).toFixed(2);

      slider.addEventListener("input", () => {
        valDisplay.textContent = Number(slider.value).toFixed(2);
        onChange(Number(slider.value));
      });

      row.appendChild(label);
      row.appendChild(slider);
      row.appendChild(valDisplay);
      return { row, slider, valDisplay };
    }

    function addGSPanelEntry(entry) {
      const container = document.createElement("div");
      container.className = "gs-entry";

      // Title row: name + visible toggle + delete
      const titleRow = document.createElement("div");
      titleRow.className = "gs-title-row";

      const nameEl = document.createElement("span");
      nameEl.className = "gs-name";
      nameEl.textContent = entry.label;
      nameEl.title = entry.label;

      const toggleBtn = document.createElement("button");
      toggleBtn.className = "gs-toggle";
      toggleBtn.textContent = "👁";
      toggleBtn.title = "Toggle visibility";
      toggleBtn.addEventListener("click", () => toggleGSVisibility(entry));

      const removeBtn = document.createElement("button");
      removeBtn.className = "gs-remove";
      removeBtn.textContent = "✕";
      removeBtn.title = "Remove";
      removeBtn.addEventListener("click", () => removeGSEntry(entry));

      titleRow.appendChild(nameEl);
      titleRow.appendChild(toggleBtn);
      titleRow.appendChild(removeBtn);
      container.appendChild(titleRow);

      // Per-GS sliders
      const { row: posRow, slider: posSlider } = makeSliderRow(
        "Position", 0, 1, 0.01, entry.alpha, !entry.hasDelta,
        (v) => { entry.alpha = v; applyVisualizationStateToEntry(entry); }
      );

      const { row: scaleRow } = makeSliderRow(
        "Scale", 0, 2, 0.01, entry.scaleMultiplier, false,
        (v) => { entry.scaleMultiplier = v; applyVisualizationStateToEntry(entry); }
      );

      const { row: rotRow } = makeSliderRow(
        "Opacity", 0, 1, 0.01, entry.opacityMultiplier, false,
        (v) => { entry.opacityMultiplier = v; applyVisualizationStateToEntry(entry); }
      );

      container.appendChild(posRow);
      container.appendChild(scaleRow);
      container.appendChild(rotRow);

      gsList.appendChild(container);

      entry.domRow = container;
      entry.domToggle = toggleBtn;
    }

    async function loadSelected() {
      const candidate = morphCandidates.find(item => item.anchorPath === candidateSelect.value);
      if (!candidate) {
        alert("Please select a candidate from the dropdown.");
        return;
      }
      if (loadedSplats.length >= MAX_GS) {
        alert(`Maximum ${MAX_GS} GS already loaded. Remove one before adding more.`);
        return;
      }

      const anchorUrl = resolveLocalPath(candidate.anchorPath);
      const deltaUrl = candidate.deltaPath ? resolveLocalPath(candidate.deltaPath) : null;
      const isPosed = candidate.variant === "posed" || isPosedAnchorPath(anchorUrl);

      setCandidateStatus("Loading...");
      try {
        const mesh = new SplatMesh({ url: anchorUrl });
        await mesh.initialized;
        if (isPosed) mesh.rotation.x = Math.PI;
        scene.add(mesh);

        const originalCenters = extractCenters(mesh);
        const { scales, opacities } = extractScalesAndOpacities(mesh);

        let deltaOffsets;
        let hasDelta = false;

        if (deltaUrl) {
          const response = await fetch(deltaUrl, { cache: "no-store" });
          if (!response.ok) throw new Error(`Failed to fetch delta: ${response.status} ${response.statusText}`);
          const buffer = await response.arrayBuffer();
          if (buffer.byteLength % (3 * 4) !== 0) throw new Error(`Invalid delta buffer size: ${buffer.byteLength}`);
          deltaOffsets = new Float32Array(buffer);
          const expectedCount = mesh.packedSplats.numSplats * 3;
          if (deltaOffsets.length !== expectedCount) {
            throw new Error(`Offset count mismatch! Anchor: ${mesh.packedSplats.numSplats}, Delta: ${deltaOffsets.length / 3}`);
          }
          hasDelta = true;
          logDeltaStats(deltaUrl, deltaOffsets);
        } else {
          deltaOffsets = new Float32Array(mesh.packedSplats.numSplats * 3);
        }

        const entry = {
          label: candidate.label,
          anchorMesh: mesh,
          deltaOffsets,
          hasDelta,
          originalCenters,
          originalScales: scales,
          originalOpacities: opacities,
          visible: true,
          alpha: 0,
          scaleMultiplier: 1,
          opacityMultiplier: 1,
          rotationY: isPosed ? Math.PI : 0,
          domRow: null,
          domToggle: null,
        };

        loadedSplats.push(entry);
        addGSPanelEntry(entry);
        applyVisualizationStateToEntry(entry);
        updateEmptyLabel();
        updateInstructionsVisibility();
        setCandidateStatus(`${loadedSplats.length}/${MAX_GS} loaded`);
      } catch (err) {
        console.error("Failed to load morph pair:", err);
        alert("Failed to load. Check paths and console.");
        setCandidateStatus("Load failed");
      }
    }

    scanTargetSelect.addEventListener("change", async () => {
      await refreshModels();
    });

    folderBrowseButton.addEventListener("click", async (event) => {
      event.stopPropagation();
      try {
        await openFolderBrowser();
      } catch (err) {
        console.error("Failed to browse expr folders:", err);
        setCandidateStatus("Browse failed");
      }
    });

    folderPanel.addEventListener("click", (event) => {
      event.stopPropagation();
    });

    document.addEventListener("click", (event) => {
      if (!folderWrapper.contains(event.target)) {
        setFolderPanelOpen(false);
      }
    });

    folderUpButton.addEventListener("click", async () => {
      try {
        await loadFolderListing(folderUpButton.dataset.parentPath || "");
      } catch (err) {
        console.error("Failed to browse parent folder:", err);
        setCandidateStatus("Browse failed");
      }
    });

    folderSelectButton.addEventListener("click", async () => {
      await selectBrowsedFolder();
    });

    folderClearButton.addEventListener("click", async () => {
      await clearFolderScope();
    });

    candidateRefreshButton.addEventListener("click", async () => {
      const selectedModel = modelSelect.value;
      if (selectedModel || hasFolderScope()) {
        await refreshCandidatesForModel(selectedModel);
      } else {
        await refreshModels();
      }
    });

    candidateLoadButton.addEventListener("click", async () => {
      await loadSelected();
    });

    updateFolderScopeLabel();
    await refreshModels();

    function animateFrame(time) {
      const deltaTime = (time - lastFrameTime) / 1000;
      lastFrameTime = time;
      updateKeyboardPan(deltaTime);
      updateKeyboardRoll(deltaTime);
      orbitControls.update();
      if (autoRotateChk.checked) {
        for (const entry of loadedSplats) {
          if (entry.anchorMesh) {
            entry.rotationY += 0.01;
            entry.anchorMesh.rotation.y = entry.rotationY;
          }
        }
      }
      renderer.render(scene, camera);
    }

    renderer.setAnimationLoop(animateFrame);
  </script>
</body>
