<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spark • Viewer</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      align-items: center;
      width: 100%;
      height: 100vh;
      background-color: rgb(43, 41, 40);
      margin: 0;
      padding: 0;
    }

    .drop-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .spark-canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    .invisible {
      opacity: 0;
      pointer-events: none;
    }

    .logo {
      position: fixed;
      top: 20px;
      left: 30px;
      z-index: 1;
    }

    .logo img {
      width: 40px;
    }

    .hero-logo {
      text-align: center;
      margin-bottom: 2rem;
    }

    .hero-logo img {
      width: 350px;
      height: auto;
      margin-bottom: 1rem;
    }

    .button,
    .url-input,
    .drop-zone {
      width: 100%;
      max-width: 300px;
      margin: 0.5rem 0;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 1rem;
      text-align: center;
    }

    .drop-zone {
      max-width: 500px;
      padding-top: 4rem;
      padding-bottom: 4rem;
    }

    .button {
      background-color: transparent;
      color: #ccc;
      border: none;
      cursor: pointer;
    }

    .button:hover {
      background-color: rgb(47, 47, 47);
    }

    .button.upload {
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgb(113, 113, 113);
      line-height: 1em;
    }

    .upload-icon {
      margin-right: 10px;
      height: 1em;
    }

    .url-input {
      background-color: rgb(47, 47, 47);
      border: none;
      color: #fff;
    }

    .drop-zone {
      border: 1px dashed #666;
      color: rgb(89, 89, 89);
      background-color: rgb(47, 47, 47);
    }

    .drop-zone.dragover {
      border: 1px dashed #aaa;
      color: rgb(170, 170, 170);
    }

    @media (min-width: 600px) {
      .button,
      .url-input,
      .drop-zone {
        font-size: 1.1rem;
      }
    }

    .hidden {
      display: none;
    }

    .spz-button {
      position: fixed;
      top: 30px;
      right: 30px;
      display: inline-flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.5em 1.5em;
      background-color: rgb(60, 60, 60);
      border: 0px solid rgb(60, 60, 60);
      border-radius: 0.5em;
      color: #ff6c6c;
      font-family: system-ui, sans-serif;
      font-size: 0.9em;
      cursor: pointer;
      z-index: 1000;
    }

    .spz-button:hover {
      background-color: rgb(90, 90, 90);
    }

    .spz-button .icon {
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>
  <script type="importmap">
    {
      "imports": {
        "three": "/examples/js/vendor/three/build/three.module.js",
        "three/addons/": "/examples/js/vendor/three/examples/jsm/",
        "@sparkjsdev/spark": "/dist/spark.module.js"
      }
    }
  </script>
  <script type="module">
    import * as THREE from "three";
    import { SplatMesh, transcodeSpz, SparkControls } from "@sparkjsdev/spark";

    const PLY_TYPE_BYTES = {
      char: 1,
      uchar: 1,
      short: 2,
      ushort: 2,
      int: 4,
      uint: 4,
      float: 4,
      double: 8,
    };

    const sparkCanvasEl = document.querySelector(".spark-canvas");
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 0, 1);
    const renderer = new THREE.WebGLRenderer({canvas: sparkCanvasEl});
    const width = sparkCanvasEl.clientWidth;
    const height = sparkCanvasEl.clientHeight;
    var fileName;
    var fileBytes;
    renderer.setSize(width, height, false);

    const controls = new SparkControls({ canvas: sparkCanvasEl });
    // const orbitControls = new OrbitControls(camera, renderer.domElement);
    // orbitControls.target.set(0, 0, 0);
    // orbitControls.minDistance = 0.1;
    // orbitControls.maxDistance = 10;

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;

      // Only resize if necessary
      const canvas = renderer.domElement;
      const needResize = canvas.width !== width || canvas.height !== height;

      if (needResize) {
        renderer.setSize(width, height, false);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
      }
    }

    window.addEventListener('resize', () => {
      setTimeout(function () { resize(); }, 100);
    });

    renderer.setAnimationLoop(function animate(time) {
      resize();
      // orbitControls.update();
      controls.update(camera);
      renderer.render(scene, camera);
    });

    // Handle drag and drop files.
    const dropZoneEl = document.querySelector('.container');
    const dropUIEl = document.querySelector('.drop-zone');
    const onDragover = function (e) {
      e.preventDefault();
      dropUIEl.classList.add('dragover');
    };
    const onDragLeave = function () {
      dropUIEl.classList.remove('dragover');
    };
    const onDrop = function (e) {
      e.preventDefault();
      dropUIEl.classList.remove('dragover');
      dropUIEl.classList.add('drop');

      const files = e.dataTransfer.files;
      if (files.length > 0) {
        loadSplatFile(files[0]);
      }
    };

    dropZoneEl.addEventListener('dragover', onDragover);
    sparkCanvasEl.addEventListener('dragover', onDragover);

    dropZoneEl.addEventListener('dragleave', onDragLeave);
    sparkCanvasEl.addEventListener('dragleave', onDragLeave);

    dropZoneEl.addEventListener('drop', onDrop);
    sparkCanvasEl.addEventListener('drop', onDrop);

    const fileInput = document.querySelector('#file-input');
    fileInput.onchange = function(event) {
      loadSplatFile(event.target.files[0]);
    };

    function parsePlyHeader(fileBytes) {
      const headerProbe = new TextDecoder().decode(fileBytes.slice(0, 65536));
      let endMarker = "end_header\n";
      let endIndex = headerProbe.indexOf(endMarker);
      if (endIndex < 0) {
        endMarker = "end_header\r\n";
        endIndex = headerProbe.indexOf(endMarker);
      }
      if (endIndex < 0) {
        return null;
      }

      const headerText = headerProbe.slice(0, endIndex + endMarker.length);
      const headerLines = headerText.trim().split(/\r?\n/);
      const headerByteLength = new TextEncoder().encode(headerText).length;

      let format = null;
      let currentElement = null;
      const comments = [];
      const elements = [];
      for (const line of headerLines) {
        const trimmed = line.trim();
        if (!trimmed) {
          continue;
        }
        const fields = trimmed.split(/\s+/);
        if (fields[0] === "format") {
          format = fields[1];
          continue;
        }
        if (fields[0] === "comment") {
          comments.push(trimmed.slice("comment ".length));
          continue;
        }
        if (fields[0] === "element") {
          currentElement = {
            name: fields[1],
            count: Number.parseInt(fields[2], 10),
            properties: [],
          };
          elements.push(currentElement);
          continue;
        }
        if (fields[0] === "property" && currentElement) {
          if (fields[1] === "list") {
            currentElement.properties.push({
              name: fields[4],
              isList: true,
              countType: fields[2],
              type: fields[3],
            });
          } else {
            currentElement.properties.push({
              name: fields[2],
              isList: false,
              type: fields[1],
            });
          }
        }
      }

      return { comments, elements, format, headerByteLength };
    }

    function reorderSam3dgsSparkPly(fileBytes, fileNameHint) {
      const header = parsePlyHeader(fileBytes);
      if (!header || header.format !== "binary_little_endian") {
        return fileBytes;
      }

      const vertexElement = header.elements.find((element) => element.name === "vertex");
      if (!vertexElement) {
        return fileBytes;
      }

      const hasSam3dgsComment = header.comments.includes("sam3dgs_rotation_order xyzw");
      const looksLikeSam3dgsSparkFile = fileNameHint != null && /(?:^|[_-])spark\.ply$/i.test(fileNameHint);
      if (!hasSam3dgsComment && !looksLikeSam3dgsSparkFile) {
        return fileBytes;
      }

      let vertexStride = 0;
      const propertyOffsets = {};
      for (const property of vertexElement.properties) {
        if (property.isList) {
          return fileBytes;
        }
        const typeBytes = PLY_TYPE_BYTES[property.type];
        if (typeBytes == null) {
          return fileBytes;
        }
        propertyOffsets[property.name] = { offset: vertexStride, type: property.type };
        vertexStride += typeBytes;
      }

      const rotProps = ["rot_0", "rot_1", "rot_2", "rot_3"].map((name) => propertyOffsets[name]);
      if (rotProps.some((prop) => prop == null || prop.type !== "float")) {
        return fileBytes;
      }

      const normalizedBytes = fileBytes.slice();
      const dataView = new DataView(
        normalizedBytes.buffer,
        normalizedBytes.byteOffset + header.headerByteLength,
        normalizedBytes.byteLength - header.headerByteLength,
      );
      for (let index = 0; index < vertexElement.count; index++) {
        const baseOffset = index * vertexStride;
        const quatX = dataView.getFloat32(baseOffset + rotProps[0].offset, true);
        const quatY = dataView.getFloat32(baseOffset + rotProps[1].offset, true);
        const quatZ = dataView.getFloat32(baseOffset + rotProps[2].offset, true);
        const quatW = dataView.getFloat32(baseOffset + rotProps[3].offset, true);
        dataView.setFloat32(baseOffset + rotProps[0].offset, quatW, true);
        dataView.setFloat32(baseOffset + rotProps[1].offset, quatX, true);
        dataView.setFloat32(baseOffset + rotProps[2].offset, quatY, true);
        dataView.setFloat32(baseOffset + rotProps[3].offset, quatZ, true);
      }
      return normalizedBytes;
    }

    async function readAndNormalizeSplatFile(splatFile) {
      const rawFileBytes = new Uint8Array(await splatFile.arrayBuffer());
      return reorderSam3dgsSparkPly(rawFileBytes, splatFile.name);
    }

    function resolveSplatUrl(rawPath) {
      if (!rawPath) {
        return rawPath;
      }
      if (
        rawPath.startsWith("http://") ||
        rawPath.startsWith("https://") ||
        rawPath.startsWith("/local/") ||
        rawPath.startsWith("/")
      ) {
        return rawPath;
      }
      return `/local/${rawPath.replace(/^\.?\//, "")}`;
    }

    function frameLoadedSplat(mesh) {
      const bounds = mesh.getBoundingBox(false);
      const center = bounds.getCenter(new THREE.Vector3());
      const size = bounds.getSize(new THREE.Vector3());
      const radius = Math.max(size.length() * 0.5, 0.25);
      const distance = radius / Math.tan((camera.fov * Math.PI / 180) * 0.5) * 1.1;

      camera.position.copy(center).add(new THREE.Vector3(0, 0, distance));
      camera.lookAt(center);
      camera.near = Math.max(distance / 100, 0.01);
      camera.far = Math.max(distance * 20, 100);
      camera.updateProjectionMatrix();
    }

    async function loadSplatFile(splatFile) {
      fileBytes = await readAndNormalizeSplatFile(splatFile);
      fileName = splatFile.name;
      setSplatFile({ fileBytes: fileBytes.slice(), fileName });
    }

    var loadedSplat;
    function setSplatFile(init) {
      if (loadedSplat) { scene.remove(loadedSplat); }

      loadedSplat = new SplatMesh({
        ...init,
        onLoad: frameLoadedSplat,
      });
      loadedSplat.quaternion.set(0, 0, 0, 1);
      scene.add(loadedSplat);

      document.querySelector('.container').classList.add('hidden');
      document.querySelector('.canvas-container').classList.remove('invisible');
    }

    let params = new URLSearchParams(document.location.search);
    let splatURL = params.get("url") || params.get("path");

    if (splatURL) { loadSplatURL(splatURL); }


    async function loadSplatURL(splatURL) {
      const resolvedUrl = resolveSplatUrl(splatURL);
      fileName = resolvedUrl.split("/").pop().split("?")[0];
      document.querySelector('.container').classList.add('hidden');
      document.querySelector('.canvas-container').classList.remove('invisible');
      if (fileName.toLowerCase().endsWith(".ply")) {
        const response = await fetch(resolvedUrl);
        if (!response.ok) {
          throw new Error(`Failed to fetch ${resolvedUrl}: ${response.status} ${response.statusText}`);
        }
        fileBytes = reorderSam3dgsSparkPly(new Uint8Array(await response.arrayBuffer()), fileName);
        setSplatFile({ fileBytes: fileBytes.slice(), fileName });
        return;
      }
      setSplatFile({ url: resolvedUrl });
    }

    const urlFormEl = document.querySelector('.url-form');
    const urlInputEl = document.querySelector('.url-input');
    urlFormEl.addEventListener('submit', function handleEnterKey(event) {
      event.preventDefault();
      const url = new URL(window.location);
      const splatURL = urlInputEl.value;
      loadSplatURL(urlInputEl.value);
      url.searchParams.set('url', splatURL);
      history.pushState(null, '', url);
    });

    document.querySelector('.spz-button').addEventListener('click', async function () {
      const fileInfo =  {
        fileBytes: fileBytes,
        pathOrUrl: fileName,
      };

      const transcodeInfo = {
        inputs: [fileInfo],
        maxSh: 3,
        fractionalBits: 12,
        opacityThreshold: 0
      };
      const transcode = await transcodeSpz(transcodeInfo);
      const blob = new Blob([transcode.fileBytes], { type: "application/octet-stream" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = fileName.split(".")[0] + ".spz";
      a.click();
      URL.revokeObjectURL(url);
    });
  </script>
  <div class="canvas-container invisible">
    <div class="logo">
      <a href="/"><img src="spark-logo.svg" alt="Spark Logo" /></a>
    </div>
    <button class="spz-button">
      <span class="icon" aria-hidden="true">
        <img src="download.svg" width="18" height="18" alt="" />
      </span>
      <span class="label">.spz</span>
    </button>
    <canvas class="spark-canvas"></canvas>
  </div>
  <div class="container">
    <div class="drop-container">
      <div class="hero-logo">
        <a href="/"><img src="spark-viewer.svg" alt="Spark Viewer Logo" /></a>
      </div>
      <div class="drop-zone">Drag and drop a splat file here</div>
      <label for="file-input" class="button upload"><img class="upload-icon" src="upload-icon.svg" alt="upload" />Choose file</label>
      <input id="file-input" class="hidden" accept=".ply,.spz,.splat,.ksplat,.zip" type="file" />
      <form class="url-form">
        <input class="url-input" type="text" placeholder="URL or repo path (e.g. expr/infer_lhmpp/avatar_lhm_canonical_spark.ply)" />
      </form>
    </div>
  </div>
</body>
</html>
